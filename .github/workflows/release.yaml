name: Pacearr Release
on:
  push:
    branches: [main]
    paths:
      - '*.mjs'
      - 'web/**'
      - 'tests/**'
      - 'Dockerfile'
      - 'package.json'
      - 'compose*.yaml'
      - 'scripts/**'
      - 'README.md'
      - 'RELEASE-NOTES.md'
      - 'docs/screenshots/**'
      - '.github/workflows/release.yaml'
  workflow_dispatch:
concurrency:
  group: pacearr-release
  cancel-in-progress: false
permissions:
  contents: write
  packages: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Unit tests and syntax
        run: |
          npm test
          node --check server.mjs
          node --check web/app.js
          node --check web/manager.js
      - name: Automation and live-action integration checks
        run: npm run test:integration
      - name: Validate portable deployment examples
        run: |
          docker compose --env-file .env.example -f compose.yaml config --quiet
          docker compose --env-file .env.example -f compose.synology.yaml config --quiet
      - name: Build and smoke test native image
        run: |
          docker build -t pacearr-smoke .
          docker run -d --name pacearr-smoke -p 127.0.0.1:3000:3000 pacearr-smoke
          trap 'docker logs pacearr-smoke; docker rm -f pacearr-smoke' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/api/healthz; then
              curl --fail --silent http://127.0.0.1:3000/hero.svg >/dev/null
              exit 0
            fi
            sleep 2
          done
          exit 1
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish current container images
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/daherokozuki/pacearr:v1.1.0
            ghcr.io/daherokozuki/pacearr:latest
            ghcr.io/daherokozuki/pacearr:alpha
          labels: |
            org.opencontainers.image.source=https://github.com/DaHeroKozuki/Pacearr
            org.opencontainers.image.version=1.1.0
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Package application update
        run: python3 scripts/package-release.py
      - name: Publish release and source bundle
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0
          target_commitish: ${{ github.sha }}
          name: Pacearr v1.1.0 — Smarter Downloads & Import Recovery
          body_path: RELEASE-NOTES.md
          make_latest: true
          prerelease: false
          files: |
            dist/pacearr-v1.1.0.zip
            dist/pacearr-v1.1.0-source.zip
            dist/SHA256SUMS
