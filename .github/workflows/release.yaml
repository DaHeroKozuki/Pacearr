name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 0.1.0-alpha)'
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Set release version
        id: version
        run: |
          VERSION="${{ github.event.inputs.version }}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check for existing version tag
        id: tag
        uses: actions/github-script@v7
        with:
          script: |
            const version = '${{ steps.version.outputs.version }}';

            try {
              const ref = await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `tags/v${version}`,
              });

              core.info(`Tag v${version} already exists; reusing ${ref.data.object.sha}`);
              core.setOutput('exists', 'true');
              core.setOutput('sha', ref.data.object.sha);
            } catch (error) {
              if (error.status !== 404) throw error;

              core.info(`Tag v${version} does not exist; creating a new release.`);
              core.setOutput('exists', 'false');
            }

      - name: Update version files
        if: steps.tag.outputs.exists != 'true'
        run: |
          npm version "${{ steps.version.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Commit version bump (signed, via GitHub API)
        if: steps.tag.outputs.exists != 'true'
        id: commit
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const packageJson = fs.readFileSync('package.json', 'utf8');
            const packageLock = fs.readFileSync('package-lock.json', 'utf8');
            const version = '${{ steps.version.outputs.version }}';

            const mutation = `
              mutation ($input: CreateCommitOnBranchInput!) {
                createCommitOnBranch(input: $input) {
                  commit { oid }
                }
              }
            `;

            const result = await github.graphql(mutation, {
              input: {
                branch: {
                  repositoryNameWithOwner: `${context.repo.owner}/${context.repo.repo}`,
                  branchName: 'main',
                },
                message: { headline: `chore: bump version to v${version} [skip ci]` },
                fileChanges: {
                  additions: [
                    { path: 'package.json', contents: Buffer.from(packageJson).toString('base64') },
                    { path: 'package-lock.json', contents: Buffer.from(packageLock).toString('base64') },
                  ],
                },
                expectedHeadOid: context.sha,
              },
            });

            core.setOutput('sha', result.createCommitOnBranch.commit.oid);

      - name: Create version tag
        if: steps.tag.outputs.exists != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const version = '${{ steps.version.outputs.version }}';
            await github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `refs/tags/v${version}`,
              sha: '${{ steps.commit.outputs.sha }}',
            });

      - name: Resolve release commit
        id: release
        run: |
          if [ "${{ steps.tag.outputs.exists }}" = "true" ]; then
            echo "sha=${{ steps.tag.outputs.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ steps.commit.outputs.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.release.outputs.sha }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/daherokozuki/pacearr:v${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ steps.release.outputs.sha }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
          generate_release_notes: true
